        - Business Products
    delete:
      operationId: BusinessProduct_deleteCategory
      parameters:
        - name: categoryId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete an unused product category
