  /api/business/companies/{companyId}:
    put:
      operationId: BusinessProduct_updateCompany
      parameters:
        - name: companyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductCompanyDto"
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Update a product company
      tags:
        - Business Products
    delete:
      operationId: BusinessProduct_deleteCompany
      parameters:
        - name: companyId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete an unused product company
      tags:
        - Business Products
  /api/business/categories:
    post:
      operationId: BusinessProduct_createCategory
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductCategoryDto"
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Create a product category
      tags:
        - Business Products
  /api/business/categories/{categoryId}:
    put:
      operationId: BusinessProduct_updateCategory
      parameters:
        - name: categoryId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductCategoryDto"
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Update a product category
