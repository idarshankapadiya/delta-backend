      tags:
        - Contact Messages
  /api/companies:
    get:
      operationId: Product_getCompanies
      parameters: []
      responses:
        "200":
          description: ""
      summary: List active product companies
      tags:
        - Products
  /api/categories:
    get:
      operationId: Product_getCategories
      parameters:
        - name: companyId
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      summary: List active product categories
      tags:
        - Products
  /api/products:
    get:
      operationId: Product_getProducts
      parameters:
        - name: companyId
          required: false
          in: query
          schema:
            type: string
        - name: categoryId
          required: false
          in: query
          schema:
            type: string
        - name: subcategoryId
          required: false
          in: query
          schema:
            type: string
        - name: stock
          required: false
          in: query
          schema:
            type: string
            enum:
              - in_stock
              - out_of_stock
        - name: search
          required: false
          in: query
          schema:
            maxLength: 120
            type: string
        - name: sort
          required: true
          in: query
          schema:
            default: name_asc
            type: string
            enum:
              - name_asc
              - name_desc
              - price_asc
              - price_desc
        - name: limit
          required: true
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 30
            allOf:
              - $ref: "#/components/schemas/Object"
        - name: cursor
          required: false
          in: query
          schema:
            maxLength: 2048
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: List and filter active products
      tags:
        - Products
  /api/products/{productId}:
    get:
      description: Returns mainImageUrl, additionalImageUrls, and parallel
        additionalImageIndices. Each index identifies the stored additional
        image for the business replace and delete endpoints.
      operationId: Product_getProduct
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: Get active product details
      tags:
        - Products
  /api/products/cart-validation:
    post:
      operationId: Quotation_validateCart
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateCartDto"
      responses:
        "200":
          description: Authoritative cart validation result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                  - items
                  - issues
                  - totals
                properties:
                  valid:
                    type: boolean
                    example: true
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - productId
                        - quantity
                        - product
                      properties:
                        productId:
                          type: string
                          example: compact-nsx-100
                        quantity:
                          type: integer
                          example: 2
                        product:
                          type: object
                          description: Current public product snapshot including price, currency,
                            discount, inStock, and optional stockQuantity.
                  issues:
                    type: array
                    items:
                      type: object
                      required:
                        - productId
                        - code
                        - message
                      properties:
                        productId:
                          type: string
                        code:
                          type: string
                          enum:
                            - duplicate
                            - not_found
                            - out_of_stock
                            - quantity_unavailable
                        message:
                          type: string
                  totals:
                    type: object
                    additionalProperties:
                      type: number
                    example:
                      INR: 18450
      summary: Validate cart products, quantities, availability, and current totals
      tags:
        - Quotations
  /api/quotation-requests:
    post:
      description: Revalidates product availability, stock quantity, prices,
        discounts, and currency on the server before saving the quotation.
        Client totals are never accepted.
      operationId: Quotation_createQuotation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuotationRequestDto"
      responses:
        "201":
          description: Quotation request saved.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - quotation
                properties:
                  ok:
                    type: boolean
                    example: true
                  quotation:
                    type: object
                    required:
                      - id
                      - reference
                      - status
                      - customer
                      - items
                      - totals
                      - created_at
                      - updated_at
                    properties:
                      id:
                        type: string
                        example: QUO-01K5ABCDEF0123456789ABCDE
                      reference:
                        type: string
                        example: QUO-01K5ABCDEF0123456789ABCDE
                      status:
                        type: string
                        example: new
                      customer:
                        type: object
                      items:
                        type: array
                        items:
                          type: object
                      totals:
                        type: object
                        additionalProperties:
                          type: number
                        example:
                          INR: 18450
                      notes:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        "409":
          description: One or more cart products or quantities are no longer available.
        "429":
          description: Quotation submission limit exceeded.
      summary: Create a quotation request from an authoritative cart snapshot
      tags:
        - Quotations
  /api/internal/catalog/documents:
    post:
      operationId: InternalCatalog_createDocument
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - company_name
                - document_name
                - file
              properties:
                company_name:
                  type: string
                category_name:
                  type: string
                document_name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - internalAdmin: []
      summary: Upload a catalog PDF through the internal API
      tags:
        - Internal Catalog
  /api/internal/catalog/documents/{document_id}:
    put:
      operationId: InternalCatalog_updateDocument
      parameters:
        - name: document_id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document_name:
                  type: string
                category_name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - internalAdmin: []
      summary: Update a catalog PDF through the internal API
      tags:
        - Internal Catalog
    delete:
      operationId: InternalCatalog_deleteDocument
      parameters:
        - name: document_id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - internalAdmin: []
      summary: Delete a catalog document through the internal API
      tags:
        - Internal Catalog
  /api/internal/catalog/companies/{company_slug}:
    put:
      operationId: InternalCatalog_updateCompany
      parameters:
        - name: company_slug
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogCompanyDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - internalAdmin: []
      summary: Rename a catalog company through the internal API
      tags:
        - Internal Catalog
  /api/internal/messages:
    get:
      operationId: InternalMessage_getMessages
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - internalAdmin: []
      summary: List contact messages through the internal API
      tags:
        - Internal Messages
  /api:
    get:
      operationId: App_getApiIndex
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: List available API endpoints
      tags:
        - System
  /api/health:
    get:
      operationId: Health_check
      parameters: []
      responses:
        "200":
          description: ""
      summary: Check backend health
      tags:
        - System
info:
  title: Delta Backend API
  description: Public catalog and product APIs, catalog access flows,
    authenticated business administration, and internal administration
    endpoints.
  version: 0.0.1
  contact: {}
tags:
  - name: System
    description: API discovery and health endpoints.
  - name: Products
    description: Public product discovery endpoints.
  - name: Catalog
    description: Public catalog and access endpoints.
  - name: Contact Messages
    description: Public contact form submission.
  - name: Quotations
    description: Public cart validation and quotation submission.
  - name: Business Authentication
    description: Business dashboard authentication and session endpoints.
  - name: Business Products
    description: Authenticated product administration.
  - name: Business Catalog
    description: Authenticated catalog administration.
  - name: Business Messages
    description: Authenticated contact message management.
  - name: Business Quotations
    description: Authenticated quotation workflow management.
  - name: Internal Catalog
    description: Service-to-service catalog administration.
  - name: Internal Messages
    description: Service-to-service message access.
servers: []
components:
  securitySchemes:
    businessSession:
      type: apiKey
      in: cookie
      name: business_session
      description: Business session cookie. Production uses __Host-business_session.
    catalogAccess:
      type: apiKey
      in: cookie
      name: catalog_access
      description: Catalog access session cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token returned by business authentication.
    internalAdmin:
      type: apiKey
      in: header
      name: X-Backend-Admin-Token
      description: Token for the optional internal administration API.
  schemas:
    BusinessGoogleAuthDto:
      type: object
      properties:
        id_token:
          type: string
          maxLength: 4096
      required:
        - id_token
    DocumentAccessDto:
      type: object
      properties:
        company_slug:
          type: string
        category_slug:
          type: string
        document_slug:
          type: string
        action:
          enum:
            - preview
            - download
          type: string
      required:
        - company_slug
        - document_slug
        - action
    UpdateCatalogCompanyDto:
      type: object
      properties:
        company_name:
          type: string
      required:
        - company_name
    CreateProductCompanyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 160
        slug:
          type: string
        logoPath:
          type: string
          maxLength: 1024
        active:
          type: boolean
        sortOrder:
          type: number
          minimum: 0
      required:
        - id
        - name
    UpdateProductCompanyDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        slug:
          type: string
        logoPath:
          type: string
          maxLength: 1024
        active:
          type: boolean
        sortOrder:
          type: number
          minimum: 0
    CreateProductCategoryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 160
        slug:
          type: string
        companyIds:
          maxItems: 1000
          type: array
          items:
            type: string
        active:
          type: boolean
        sortOrder:
          type: number
          minimum: 0
      required:
        - id
        - name
        - companyIds
    UpdateProductCategoryDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        slug:
          type: string
        companyIds:
          maxItems: 1000
          type: array
          items:
            type: string
        active:
          type: boolean
        sortOrder:
          type: number
          minimum: 0
    CreateProductDto:
      type: object
      properties:
        productId:
          type: string
        name:
          type: string
          maxLength: 240
        sku:
          type: string
          maxLength: 160
        modelNumber:
          type: string
          maxLength: 160
        isNewCompany:
          type: boolean
        companyName:
          type: string
          maxLength: 160
        companyId:
          type: string
        isNewCategory:
          type: boolean
        categoryName:
          type: string
          maxLength: 160
        categoryId:
          type: string
        subcategoryId:
          type: string
        subcategoryName:
          type: string
          maxLength: 160
        subcategorySlug:
          type: string
        price:
          type: number
          minimum: 0
        currency:
          type: string
        discountPercentage:
          type: number
          minimum: 0
          maximum: 100
        inStock:
          type: boolean
        stockQuantity:
          type: number
          minimum: 0
        active:
          type: boolean
        shortDescription:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 20000
        specifications:
          type: object
          additionalProperties: true
        thumbnailPath:
          type: string
          maxLength: 1024
        mainImagePath:
          type: string
          maxLength: 1024
        additionalImagePaths:
          maxItems: 20
          type: array
          items:
            type: string
            maxLength: 1024
        brochurePath:
          type: string
          maxLength: 1024
      required:
        - name
        - price
        - inStock
    UpdateProductDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 240
        sku:
          type: string
          maxLength: 160
        modelNumber:
          type: string
          maxLength: 160
        companyId:
          type: string
        categoryId:
          type: string
        subcategoryId:
          type: string
        subcategoryName:
          type: string
          maxLength: 160
        subcategorySlug:
          type: string
        price:
          type: number
          minimum: 0
        currency:
          type: string
        discountPercentage:
          type: number
          minimum: 0
          maximum: 100
        inStock:
          type: boolean
        stockQuantity:
          type: number
          minimum: 0
        active:
          type: boolean
        shortDescription:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 20000
        specifications:
          type: object
          additionalProperties: true
        thumbnailPath:
          type: string
          maxLength: 1024
        mainImagePath:
          type: string
          maxLength: 1024
        additionalImagePaths:
          maxItems: 20
          type: array
          items:
            type: string
            maxLength: 1024
        brochurePath:
          type: string
          maxLength: 1024
    UpdateQuotationStatusDto:
      type: object
      properties:
        status:
          enum:
            - new
            - reviewing
            - quoted
            - closed
            - cancelled
          type: string
      required:
        - status
    CatalogLibraryDto:
      type: object
      properties:
        company_slugs:
          minItems: 1
          type: array
          items:
            type: string
      required:
        - company_slugs
    CatalogAccessDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        mobile:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 160
          format: email
        message:
          type: string
          maxLength: 1000
      required:
        - name
        - mobile
    CatalogGoogleAccessDto:
      type: object
      properties:
        id_token:
          type: string
          maxLength: 4096
      required:
        - id_token
    CatalogFirebaseAccessDto:
      type: object
      properties:
        id_token:
          type: string
          maxLength: 4096
      required:
        - id_token
    CatalogGoogleRedirectDto:
      type: object
      properties:
        credential:
          type: string
          maxLength: 4096
        g_csrf_token:
          type: string
          maxLength: 512
      required:
        - credential
        - g_csrf_token
    CatalogOtpRequestDto:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 160
        captcha_token:
          type: string
          maxLength: 4096
      required:
        - identifier
    CatalogVerifyOtpDto:
      type: object
      properties:
        challenge_id:
          type: string
          maxLength: 40
        code:
          type: string
          maxLength: 6
          pattern: ^\d{6}$
      required:
        - challenge_id
        - code
    CatalogResendOtpDto:
      type: object
      properties:
        challenge_id:
          type: string
          maxLength: 40
      required:
        - challenge_id
    CreateMessageDto:
      type: object
      properties:
        captcha_token:
          type: string
          maxLength: 4096
        name:
          type: string
          maxLength: 120
        mobile:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 160
          format: email
        message:
          type: string
          maxLength: 2000
      required:
        - name
        - mobile
        - email
        - message
    Object:
      type: object
      properties: {}
    QuotationCartItemDto:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: number
          minimum: 1
          maximum: 999
      required:
        - productId
        - quantity
    ValidateCartDto:
      type: object
      properties:
        items:
          minItems: 1
          maxItems: 50
          type: array
          items:
            $ref: "#/components/schemas/QuotationCartItemDto"
      required:
        - items
    QuotationCustomerDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        company:
          type: string
          maxLength: 160
        email:
          type: string
          maxLength: 160
          format: email
        mobile:
          type: string
          pattern: ^\d{10}$
        deliveryLocation:
          type: string
          maxLength: 500
      required:
        - name
        - email
        - mobile
        - deliveryLocation
    CreateQuotationRequestDto:
      type: object
      properties:
        items:
          minItems: 1
          maxItems: 50
          type: array
          items:
            $ref: "#/components/schemas/QuotationCartItemDto"
        captcha_token:
          type: string
          maxLength: 4096
        customer:
          $ref: "#/components/schemas/QuotationCustomerDto"
        notes:
          type: string
          maxLength: 2000
      required:
        - items
        - customer
