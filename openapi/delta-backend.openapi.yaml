        "409":
          description: The authenticated customer changed.
      security:
        - catalogAccess: []
      summary: List the authenticated customer's orders
      tags:
        - Customer Orders
    post:
      description: Snapshots validated cart pricing into Firestore, records payment as
        pending, and clears the cart. orderRequestId makes retries idempotent.
        VITE_DISCOUNTS_ENABLED=false on the backend disables product discounts
        and uses original product prices; true or unset applies catalog
        discounts. Saved snapshots record the applied discount (zero when
        disabled). Existing snapshots are not repriced. Shipping is added
        separately. Client prices and discount flags are never accepted.
      operationId: Order_createOrder
      parameters:
        - name: X-Expected-Customer-Id
          in: header
          description: Must equal the customer in the authenticated session.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponseDto"
        "400":
          description: Invalid checkout details or empty cart.
        "401":
          description: Catalog access is required.
        "409":
          description: The authenticated customer changed.
      security:
        - catalogAccess: []
      summary: Place the authenticated customer's order
      tags:
        - Customer Orders
  /api/products/cart-validation:
    post:
      description: VITE_DISCOUNTS_ENABLED=false on the backend disables product
        discounts and uses original product prices; true or unset applies
        catalog discounts. Saved snapshots record the applied discount (zero
        when disabled). Existing snapshots are not repriced. Client prices and
        discount flags are never accepted.
      operationId: Quotation_validateCart
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateCartDto"
      responses:
        "200":
          description: Authoritative cart validation result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                  - items
                  - issues
                  - totals
                properties:
                  valid:
                    type: boolean
                    example: true
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - productId
                        - quantity
                        - product
                      properties:
                        productId:
                          type: string
                          example: compact-nsx-100
                        quantity:
                          type: integer
                          example: 2
                        product:
                          type: object
                          description: Current public product snapshot including price, currency,
                            discount, inStock, and optional stockQuantity.
                  issues:
                    type: array
                    items:
                      type: object
                      required:
                        - productId
                        - code
                        - message
                      properties:
                        productId:
                          type: string
                        code:
                          type: string
                          enum:
                            - duplicate
                            - not_found
                            - out_of_stock
                            - quantity_unavailable
                        message:
                          type: string
                  totals:
                    type: object
                    additionalProperties:
                      type: number
                    example:
                      INR: 18450
      summary: Validate cart products, quantities, availability, and current totals
      tags:
        - Quotations
  /api/quotation-requests:
    post:
      description: Revalidates product availability, stock quantity, prices,
        discounts, and currency on the server before saving the quotation.
        Client totals and discount flags are never accepted.
        VITE_DISCOUNTS_ENABLED=false on the backend disables product discounts
        and uses original product prices; true or unset applies catalog
        discounts. Saved snapshots record the applied discount (zero when
        disabled). Existing snapshots are not repriced.
      operationId: Quotation_createQuotation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuotationRequestDto"
      responses:
        "201":
          description: Quotation request saved.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - quotation
                properties:
                  ok:
                    type: boolean
                    example: true
                  quotation:
                    type: object
                    required:
                      - id
                      - reference
                      - status
                      - customer
                      - items
                      - totals
                      - created_at
                      - updated_at
                    properties:
                      id:
                        type: string
                        example: QUO-01K5ABCDEF0123456789ABCDE
                      reference:
                        type: string
                        example: QUO-01K5ABCDEF0123456789ABCDE
                      status:
                        type: string
                        example: new
                      customer:
                        type: object
                      items:
                        type: array
                        items:
                          type: object
                      totals:
                        type: object
                        additionalProperties:
                          type: number
                        example:
                          INR: 18450
                      notes:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        "409":
          description: One or more cart products or quantities are no longer available.
        "429":
          description: Quotation submission limit exceeded.
      summary: Create a quotation request from an authoritative cart snapshot
      tags:
        - Quotations
  /api/internal/catalog/documents:
    post:
      operationId: InternalCatalog_createDocument
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - company_name
                - document_name
                - file
              properties:
                company_name:
                  type: string
                category_name:
                  type: string
                document_name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - internalAdmin: []
      summary: Upload a catalog PDF through the internal API
      tags:
        - Internal Catalog
  /api/internal/catalog/documents/{document_id}:
    put:
      operationId: InternalCatalog_updateDocument
      parameters:
        - name: document_id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document_name:
                  type: string
                category_name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - internalAdmin: []
      summary: Update a catalog PDF through the internal API
      tags:
        - Internal Catalog
    delete:
      operationId: InternalCatalog_deleteDocument
      parameters:
        - name: document_id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - internalAdmin: []
      summary: Delete a catalog document through the internal API
      tags:
        - Internal Catalog
  /api/internal/catalog/companies/{company_slug}:
    put:
      operationId: InternalCatalog_updateCompany
      parameters:
        - name: company_slug
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogCompanyDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - internalAdmin: []
      summary: Rename a catalog company through the internal API
      tags:
        - Internal Catalog
  /api/internal/messages:
    get:
      operationId: InternalMessage_getMessages
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - internalAdmin: []
      summary: List contact messages through the internal API
      tags:
        - Internal Messages
  /api:
    get:
      operationId: App_getApiIndex
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: List available API endpoints
      tags:
        - System
  /api/health:
    get:
      operationId: Health_check
      parameters: []
      responses:
        "200":
          description: ""
      summary: Check backend health
      tags:
        - System
info:
  title: Delta Backend API
  description: Public catalog and product APIs, catalog access flows,
    authenticated business administration, and internal administration
    endpoints.
  version: 0.0.1
  contact: {}
tags:
  - name: System
    description: API discovery and health endpoints.
  - name: Products
    description: Public product discovery endpoints.
  - name: Customer Cart
    description: Authenticated customer cart endpoints.
  - name: Customer Orders
    description: Authenticated customer checkout and order-history endpoints.
  - name: Catalog
    description: Public catalog and access endpoints.
  - name: Contact Messages
    description: Public contact form submission.
  - name: Quotations
    description: Public cart validation and quotation submission.
  - name: Business Authentication
    description: Business dashboard authentication and session endpoints.
  - name: Business Products
    description: Authenticated product administration.
  - name: Business Inventory
    description: Authenticated stock levels, receipts, counts, adjustments,
      movements, and order fulfillment.
  - name: Business Catalog
    description: Authenticated catalog administration.
  - name: Business Messages
    description: Authenticated contact message management.
  - name: Business Quotations
    description: Authenticated quotation workflow management.
  - name: Business Orders
    description: Authenticated customer-order fulfillment and stock transitions.
  - name: Internal Catalog
    description: Service-to-service catalog administration.
  - name: Internal Messages
    description: Service-to-service message access.
servers: []
components:
  securitySchemes:
    businessSession:
      type: apiKey
      in: cookie
      name: business_session
      description: Business session cookie. Production uses __Host-business_session.
    catalogAccess:
      type: apiKey
      in: cookie
      name: catalog_access
      description: Catalog access session cookie scoped to /api.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token returned by business authentication.
    internalAdmin:
      type: apiKey
      in: header
      name: X-Backend-Admin-Token
      description: Token for the optional internal administration API.
  schemas:
    BusinessGoogleAuthDto:
      type: object
      properties:
        id_token:
          type: string
          maxLength: 4096
      required:
        - id_token
    DocumentAccessDto:
      type: object
      properties:
        company_slug:
          type: string
        category_slug:
          type: string
        document_slug:
          type: string
        action:
          enum:
            - preview
            - download
          type: string
      required:
        - company_slug
        - document_slug
        - action
    UpdateCatalogCompanyDto:
      type: object
      properties:
        company_name:
          type: string
      required:
        - company_name
    InventoryReferenceDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    InventoryItemResponseDto:
      type: object
      properties:
        productId:
          type: string
        name:
          type: string
        sku:
          type: string
        modelNumber:
          type: string
        company:
          $ref: "#/components/schemas/InventoryReferenceDto"
        category:
          $ref: "#/components/schemas/InventoryReferenceDto"
        onHandQuantity:
          type: number
          minimum: 0
        reservedQuantity:
          type: number
          minimum: 0
        availableQuantity:
          type: number
          minimum: 0
        incomingQuantity:
          type: number
          minimum: 0
        damagedQuantity:
          type: number
          minimum: 0
        reorderLevel:
          type: number
          minimum: 0
        status:
          enum:
            - IN_STOCK
            - LOW_STOCK
            - OUT_OF_STOCK
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - productId
        - name
        - company
        - category
        - onHandQuantity
        - reservedQuantity
        - availableQuantity
        - incomingQuantity
        - damagedQuantity
        - reorderLevel
        - status
        - updatedAt
    InventoryListResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItemResponseDto"
      required:
        - data
    InventoryMovementResponseDto:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        type:
          type: string
          enum:
            - OPENING_BALANCE
            - PURCHASE_RECEIPT
            - ORDER_RESERVATION
            - RESERVATION_RELEASE
            - ORDER_DISPATCH
            - CUSTOMER_RETURN
            - DAMAGE
            - MANUAL_ADJUSTMENT
            - STOCK_COUNT
        quantityDelta:
          type: number
        onHandBefore:
          type: number
          minimum: 0
        onHandAfter:
          type: number
          minimum: 0
        reservedBefore:
          type: number
          minimum: 0
        reservedAfter:
          type: number
          minimum: 0
        referenceType:
          type: string
        referenceId:
          type: string
        reason:
          type: string
        notes:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - productId
        - type
        - quantityDelta
        - onHandBefore
        - onHandAfter
        - reservedBefore
        - reservedAfter
        - reason
        - createdBy
        - createdAt
    InventoryMovementListResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/InventoryMovementResponseDto"
      required:
        - data
    ReceiveStockDto:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: number
          minimum: 1
        referenceId:
          type: string
          maxLength: 160
          example: PO-2026-0042
        notes:
          type: string
          maxLength: 1000
      required:
        - productId
        - quantity
        - referenceId
    AdjustStockDto:
      type: object
      properties:
        quantityDelta:
          type: number
          description: Signed on-hand quantity change.
          example: -2
        type:
          enum:
            - DAMAGE
            - MANUAL_ADJUSTMENT
          type: string
        reason:
          type: string
          maxLength: 500
        notes:
          type: string
          maxLength: 1000
      required:
        - quantityDelta
        - type
        - reason
    StockCountDto:
      type: object
      properties:
        countedQuantity:
          type: number
          minimum: 0
        reason:
          type: string
          maxLength: 500
        notes:
          type: string
          maxLength: 1000
      required:
        - countedQuantity
        - reason
    UpdateInventorySettingsDto:
      type: object
      properties:
        reorderLevel:
          type: number
          minimum: 0
      required:
        - reorderLevel
    CreateProductCompanyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 160
        slug:
          type: string
        logoPath:
          type: string
          maxLength: 1024
        active:
          type: boolean
        sortOrder:
          type: number
          minimum: 0
      required:
        - id
        - name
    UpdateProductCompanyDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        slug:
          type: string
        logoPath:
          type: string
          maxLength: 1024
        active:
          type: boolean
        sortOrder:
          type: number
          minimum: 0
    CreateProductCategoryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 160
        slug:
          type: string
        companyIds:
          maxItems: 1000
          type: array
          items:
            type: string
        active:
          type: boolean
        sortOrder:
          type: number
          minimum: 0
      required:
        - id
        - name
        - companyIds
    UpdateProductCategoryDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        slug:
          type: string
        companyIds:
          maxItems: 1000
          type: array
          items:
            type: string
        active:
          type: boolean
        sortOrder:
          type: number
          minimum: 0
    CreateProductDto:
      type: object
      properties:
        productId:
          type: string
        name:
          type: string
          maxLength: 240
        sku:
          type: string
          maxLength: 160
        modelNumber:
          type: string
          maxLength: 160
        isNewCompany:
          type: boolean
        companyName:
          type: string
          maxLength: 160
        companyId:
          type: string
        isNewCategory:
          type: boolean
        categoryName:
          type: string
          maxLength: 160
        categoryId:
          type: string
        subcategoryId:
          type: string
        subcategoryName:
          type: string
          maxLength: 160
        subcategorySlug:
          type: string
        price:
          type: number
          minimum: 0
        currency:
          type: string
        discountPercentage:
          type: number
          minimum: 0
          maximum: 100
        inStock:
          type: boolean
        stockQuantity:
          type: number
          minimum: 0
        active:
          type: boolean
        shortDescription:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 20000
        specifications:
          type: object
          additionalProperties: true
        thumbnailPath:
          type: string
          maxLength: 1024
        mainImagePath:
          type: string
          maxLength: 1024
        additionalImagePaths:
          maxItems: 20
          type: array
          items:
            type: string
            maxLength: 1024
        brochurePath:
          type: string
          maxLength: 1024
      required:
        - name
        - price
        - inStock
    UpdateProductDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 240
        sku:
          type: string
          maxLength: 160
        modelNumber:
          type: string
          maxLength: 160
        companyId:
          type: string
        categoryId:
          type: string
        subcategoryId:
          type: string
        subcategoryName:
          type: string
          maxLength: 160
        subcategorySlug:
          type: string
        price:
          type: number
          minimum: 0
        currency:
          type: string
        discountPercentage:
          type: number
          minimum: 0
          maximum: 100
        active:
          type: boolean
        shortDescription:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 20000
        specifications:
          type: object
          additionalProperties: true
        thumbnailPath:
          type: string
          maxLength: 1024
        mainImagePath:
          type: string
          maxLength: 1024
        additionalImagePaths:
          maxItems: 20
          type: array
          items:
            type: string
            maxLength: 1024
        brochurePath:
          type: string
          maxLength: 1024
    UpdateQuotationStatusDto:
      type: object
      properties:
        status:
          enum:
            - new
            - reviewing
            - quoted
            - closed
            - cancelled
          type: string
      required:
        - status
    CatalogLibraryDto:
      type: object
      properties:
        company_slugs:
          minItems: 1
          type: array
          items:
            type: string
      required:
        - company_slugs
    CatalogAccessDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        mobile:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 160
          format: email
        message:
          type: string
          maxLength: 1000
      required:
        - name
        - mobile
    CatalogGoogleAccessDto:
      type: object
      properties:
        id_token:
          type: string
          maxLength: 4096
      required:
        - id_token
    CatalogFirebaseAccessDto:
      type: object
      properties:
        id_token:
          type: string
          maxLength: 4096
      required:
        - id_token
    CatalogGoogleRedirectDto:
      type: object
      properties:
        credential:
          type: string
          maxLength: 4096
        g_csrf_token:
          type: string
          maxLength: 512
      required:
        - credential
        - g_csrf_token
    CatalogOtpRequestDto:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 160
        captcha_token:
          type: string
          maxLength: 4096
      required:
        - identifier
    CatalogVerifyOtpDto:
      type: object
      properties:
        challenge_id:
          type: string
          maxLength: 40
        code:
          type: string
          maxLength: 6
          pattern: ^\d{6}$
      required:
        - challenge_id
        - code
    CatalogResendOtpDto:
      type: object
      properties:
        challenge_id:
          type: string
          maxLength: 40
      required:
        - challenge_id
    CreateMessageDto:
      type: object
      properties:
        captcha_token:
          type: string
          maxLength: 4096
        name:
          type: string
          maxLength: 120
        mobile:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 160
          format: email
        message:
          type: string
          maxLength: 2000
      required:
        - name
        - mobile
        - email
        - message
    Object:
      type: object
      properties: {}
    CartProductReferenceDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug
    CartProductDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        modelNumber:
          type: string
        company:
          $ref: "#/components/schemas/CartProductReferenceDto"
        category:
          $ref: "#/components/schemas/CartProductReferenceDto"
        price:
          type: number
          example: 100
        currency:
          type: string
          example: INR
        discountPercentage:
          type: number
          example: 10
        inStock:
          type: boolean
        stockQuantity:
          type: number
          minimum: 0
        thumbnailUrl:
          type: string
      required:
        - id
        - name
        - company
        - category
        - price
        - currency
        - discountPercentage
        - inStock
    CustomerCartItemDto:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: number
          minimum: 1
          maximum: 999
        product:
          $ref: "#/components/schemas/CartProductDto"
      required:
        - productId
        - quantity
        - product
    CustomerCartResponseDto:
      type: object
      properties:
        customer_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerCartItemDto"
      required:
        - customer_id
        - items
    SetCartItemDto:
      type: object
      properties:
        quantity:
          type: number
          minimum: 1
          maximum: 999
          example: 2
      required:
        - quantity
    MergeCartItemDto:
      type: object
      properties:
        quantity:
          type: number
          minimum: 1
          maximum: 999
          example: 2
        productId:
          type: string
          example: compact-nsx-100
      required:
        - quantity
        - productId
    MergeCartDto:
      type: object
      properties:
        strategy:
          type: string
          enum:
            - maximum_quantity
          example: maximum_quantity
        items:
          minItems: 1
          maxItems: 50
          type: array
          items:
            $ref: "#/components/schemas/MergeCartItemDto"
      required:
        - strategy
        - items
    CustomerOrderLineItemDto:
      type: object
      properties:
        product_id:
          type: string
        name:
          type: string
        sku:
          type: string
        model_number:
          type: string
        quantity:
          type: number
          minimum: 1
        unit_price:
          type: number
          minimum: 0
        line_total:
          type: number
          minimum: 0
        currency:
          type: string
          example: INR
      required:
        - product_id
        - name
        - quantity
        - unit_price
        - line_total
        - currency
    CustomerOrderDto:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        reference:
          type: string
          example: DE-01K5ABCDEF1234567890
        status:
          type: string
          example: placed
        payment_status:
          type: string
          example: pending
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerOrderLineItemDto"
        item_count:
          type: number
          minimum: 0
          description: Sum of all ordered quantities.
        totals:
          type: object
          additionalProperties:
            type: object
            properties:
              subtotal:
                type: number
                minimum: 0
              shipping:
                type: number
                minimum: 0
              total:
                type: number
                minimum: 0
            required:
              - subtotal
              - shipping
              - total
          description: Order totals keyed by ISO 4217 currency code.
          example:
            INR:
              subtotal: 1200
              shipping: 300
              total: 1500
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - order_id
        - reference
        - status
        - payment_status
        - items
        - item_count
        - totals
        - created_at
        - updated_at
    CustomerOrdersResponseDto:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/CustomerOrderDto"
      required:
        - orders
    OrderAddressDto:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
          example: Ankita
        lastName:
          type: string
          maxLength: 100
          example: Patel
        company:
          type: string
          maxLength: 200
        gstNumber:
          type: string
          pattern: ^[0-9A-Z]{15}$
          example: 27ABCDE1234F1Z5
        addressLine1:
          type: string
          maxLength: 250
        addressLine2:
          type: string
          maxLength: 250
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postcode:
          type: string
          pattern: ^\d{6}$
          example: "411001"
        phone:
          type: string
          pattern: ^\d{10}$
          example: "9876543210"
      required:
        - firstName
        - lastName
        - addressLine1
        - city
        - state
        - postcode
        - phone
    CreateOrderDto:
      type: object
      properties:
        orderRequestId:
          type: string
          format: uuid
        email:
          type: string
          maxLength: 254
          format: email
          example: customer@example.com
        billingAddress:
          $ref: "#/components/schemas/OrderAddressDto"
        shippingAddress:
          $ref: "#/components/schemas/OrderAddressDto"
        notes:
          type: string
          maxLength: 2000
        termsAccepted:
          type: boolean
          example: true
      required:
        - orderRequestId
        - email
        - billingAddress
        - termsAccepted
    CreateOrderResponseDto:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        order_id:
          type: string
        reference:
          type: string
          example: DE-01K5ABCDEF1234567890
        status:
          type: string
          example: placed
        payment_status:
          type: string
          example: pending
        created_at:
          type: string
          format: date-time
      required:
        - ok
        - order_id
        - reference
        - status
        - payment_status
        - created_at
    QuotationCartItemDto:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: number
          minimum: 1
          maximum: 999
      required:
        - productId
        - quantity
    ValidateCartDto:
      type: object
      properties:
        items:
          minItems: 1
          maxItems: 50
          type: array
          items:
            $ref: "#/components/schemas/QuotationCartItemDto"
      required:
        - items
    QuotationCustomerDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        company:
          type: string
          maxLength: 160
        email:
          type: string
          maxLength: 160
          format: email
        mobile:
          type: string
          pattern: ^\d{10}$
        deliveryLocation:
          type: string
          maxLength: 500
      required:
        - name
        - email
        - mobile
        - deliveryLocation
    CreateQuotationRequestDto:
      type: object
      properties:
        items:
          minItems: 1
          maxItems: 50
          type: array
          items:
            $ref: "#/components/schemas/QuotationCartItemDto"
        captcha_token:
          type: string
          maxLength: 4096
        customer:
          $ref: "#/components/schemas/QuotationCustomerDto"
        notes:
          type: string
          maxLength: 2000
      required:
        - items
        - customer
