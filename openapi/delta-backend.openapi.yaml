      tags:
        - Catalog
  /api/message:
    post:
      operationId: Message_createMessage
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
