  /api/orders:
    get:
      description: Returns only orders owned by the customer in the authenticated
        catalog session, newest first. The customer header is a race-condition
        guard and never selects ownership.
      operationId: Order_getOrders
      parameters:
        - name: X-Expected-Customer-Id
          in: header
          description: Must equal the customer in the authenticated session.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Up to 100 orders owned by the authenticated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOrdersResponseDto"
