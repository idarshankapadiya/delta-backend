openapi: 3.0.0
paths:
  /api/business/auth/google:
    post:
      operationId: BusinessAuth_authenticateWithGoogle
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessGoogleAuthDto"
      responses:
        "201":
          description: ""
      summary: Create a business session with Google
      tags:
        - Business Authentication
  /api/business/auth/me:
    get:
      operationId: BusinessAuth_getCurrentUser
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
      summary: Get the current business session
      tags:
        - Business Authentication
  /api/business/auth/logout:
    post:
      operationId: BusinessAuth_logout
      parameters: []
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Log out of the business session
      tags:
        - Business Authentication
  /api/business/catalog/all:
    get:
      operationId: BusinessCatalog_getCatalogAll
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
      summary: Get catalog data for business administration
      tags:
        - Business Catalog
  /api/business/catalog/documents:
    post:
      operationId: BusinessCatalog_createDocument
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - company_name
                - document_name
                - file
              properties:
                company_name:
                  type: string
                category_name:
                  type: string
                document_name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
          csrfToken: []
      summary: Upload a catalog PDF document
      tags:
        - Business Catalog
  /api/business/catalog/documents/access:
    post:
      operationId: BusinessCatalog_createDocumentAccess
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAccessDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
          csrfToken: []
      summary: Create an administrative signed document URL
      tags:
        - Business Catalog
  /api/business/catalog/documents/{document_id}:
    put:
      operationId: BusinessCatalog_updateDocument
      parameters:
        - name: document_id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document_name:
                  type: string
                category_name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
          csrfToken: []
      summary: Update or replace a catalog PDF document
      tags:
        - Business Catalog
    delete:
      operationId: BusinessCatalog_deleteDocument
      parameters:
        - name: document_id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete a catalog document
      tags:
        - Business Catalog
  /api/business/catalog/companies/{company_slug}:
    put:
      operationId: BusinessCatalog_updateCompany
      parameters:
        - name: company_slug
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogCompanyDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
          csrfToken: []
      summary: Rename or merge a catalog company
      tags:
        - Business Catalog
  /api/business/messages:
    get:
      operationId: BusinessMessage_getMessages
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
      summary: List contact messages
      tags:
        - Business Messages
  /api/business/messages/{message_id}:
    delete:
      operationId: BusinessMessage_deleteMessage
      parameters:
        - name: message_id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete a contact message
      tags:
        - Business Messages
  /api/business/companies:
    post:
      operationId: BusinessProduct_createCompany
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductCompanyDto"
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Create a product company
      tags:
        - Business Products
  /api/business/companies/{companyId}:
    put:
      operationId: BusinessProduct_updateCompany
      parameters:
        - name: companyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductCompanyDto"
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Update a product company
      tags:
        - Business Products
    delete:
      description: Deletes a company only when no products reference it, removes the
        company from linked categories, and clears its product and thumbnail
        storage prefixes, including empty folders.
      operationId: BusinessProduct_deleteCompany
      parameters:
        - name: companyId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: The unused company, its owned storage prefixes, and its category
            links were deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - deletedCompanyId
                  - deletedAssets
                  - updatedCategories
                properties:
                  ok:
                    type: boolean
                    example: true
                  deletedCompanyId:
                    type: string
                  deletedAssets:
                    type: integer
                    minimum: 0
                  updatedCategories:
                    type: integer
                    minimum: 0
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete an unused product company
      tags:
        - Business Products
  /api/business/categories:
    post:
      operationId: BusinessProduct_createCategory
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductCategoryDto"
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Create a product category
      tags:
        - Business Products
  /api/business/categories/{categoryId}:
    put:
      operationId: BusinessProduct_updateCategory
      parameters:
        - name: categoryId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductCategoryDto"
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Update a product category
      tags:
        - Business Products
    delete:
      operationId: BusinessProduct_deleteCategory
      parameters:
        - name: categoryId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete an unused product category
      tags:
        - Business Products
  /api/business/products:
    post:
      operationId: BusinessProduct_createProduct
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductDto"
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Create a product and optionally its company or category
      tags:
        - Business Products
  /api/business/products/upload:
    post:
      operationId: BusinessProduct_createProductUpload
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - product
                - main_image
              properties:
                product:
                  type: string
                  description: JSON-encoded CreateProductDto payload.
                main_image:
                  type: string
                  format: binary
                  description: Required JPEG, PNG, WebP, or AVIF main image. A WebP thumbnail is
                    generated automatically.
                additional_images:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
                  description: Optional replacement additional product images.
                brochure:
                  type: string
                  format: binary
                  description: Optional PDF brochure.
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Create a product and upload its assets
      tags:
        - Business Products
  /api/business/products/{productId}:
    put:
      operationId: BusinessProduct_updateProduct
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductDto"
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Update a product
      tags:
        - Business Products
    delete:
      description: Permanently deletes the selected product regardless of its stock
        status and clears its complete product and thumbnail storage prefixes,
        including empty folders. Its company and category are also deleted when
        no other products reference them; deleting the last company product
        clears the company storage prefixes. This action cannot be undone.
      operationId: BusinessProduct_deleteProduct
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: The product and its complete owned storage prefixes were
            permanently deleted. Nullable relationship IDs identify any company
            or category that was also deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - deletedProductId
                  - deletedAssets
                  - deletedCompanyId
                  - deletedCategoryId
                  - updatedCategories
                properties:
                  ok:
                    type: boolean
                    example: true
                  deletedProductId:
                    type: string
                  deletedAssets:
                    type: integer
                    minimum: 0
                    description: Number of stored objects removed from the product prefixes,
                      including orphaned objects and folder markers.
                  deletedCompanyId:
                    type: string
                    nullable: true
                  deletedCategoryId:
                    type: string
                    nullable: true
                  updatedCategories:
                    type: integer
                    minimum: 0
      security:
        - businessSession: []
          csrfToken: []
      summary: Permanently delete a product
      tags:
        - Business Products
  /api/business/products/{productId}/specifications/{key}:
    put:
      description: Updates an existing specification value and optionally renames its
        key. Returns 404 when the product or specification does not exist and
        409 when the new key already exists.
      operationId: BusinessProduct_updateProductSpecification
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
        - name: key
          required: true
          in: path
          schema:
            maxLength: 160
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 160
                value:
                  description: String, number, boolean, or null.
                  oneOf:
                    - type: string
                    - type: number
                    - type: boolean
                    - type: string
                      nullable: true
                      enum:
                        - null
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - productId
                  - key
                  - value
                properties:
                  ok:
                    type: boolean
                    example: true
                  productId:
                    type: string
                  key:
                    type: string
                  value:
                    description: Updated specification value (string, number, boolean, or null).
        "404":
          description: Product or specification not found.
        "409":
          description: Replacement key already exists.
      security:
        - businessSession: []
          csrfToken: []
      summary: Edit one product specification
      tags:
        - Business Products
    delete:
      description: Removes an existing specification. Returns 404 when the product or
        specification does not exist.
      operationId: BusinessProduct_deleteProductSpecification
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
        - name: key
          required: true
          in: path
          schema:
            maxLength: 160
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - productId
                  - deletedKey
                properties:
                  ok:
                    type: boolean
                    example: true
                  productId:
                    type: string
                  deletedKey:
                    type: string
        "404":
          description: Product or specification not found.
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete one product specification
      tags:
        - Business Products
  /api/business/products/{productId}/upload:
    put:
      operationId: BusinessProduct_updateProductUpload
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - product
              properties:
                product:
                  type: string
                  description: JSON-encoded UpdateProductDto payload.
                main_image:
                  type: string
                  format: binary
                  description: Optional replacement main image. A replacement WebP thumbnail is
                    generated automatically.
                additional_images:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
                  description: Optional replacement additional product images.
                brochure:
                  type: string
                  format: binary
                  description: Optional PDF brochure.
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Update a product and upload replacement assets
      tags:
        - Business Products
  /api/business/products/{productId}/main-image:
    put:
      operationId: BusinessProduct_replaceMainImage
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: One JPEG, PNG, WebP, or AVIF image, up to 20 MB.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - productId
                  - image
                properties:
                  ok:
                    type: boolean
                    example: true
                  productId:
                    type: string
                  image:
                    type: string
                    enum:
                      - main
                      - additional
                  index:
                    type: integer
                    minimum: 0
                    description: Zero-based additional image index.
                  deletedAssets:
                    type: integer
                    minimum: 0
        "404":
          description: Product not found.
      security:
        - businessSession: []
          csrfToken: []
      summary: Replace the main image and regenerate its WebP thumbnail
      tags:
        - Business Products
    delete:
      description: Removes the main image and thumbnail objects and clears current and
        legacy image references from the product.
      operationId: BusinessProduct_deleteMainImage
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - productId
                  - image
                  - deletedAssets
                properties:
                  ok:
                    type: boolean
                    example: true
                  productId:
                    type: string
                  image:
                    type: string
                    enum:
                      - main
                      - additional
                  index:
                    type: integer
                    minimum: 0
                    description: Zero-based additional image index.
                  deletedAssets:
                    type: integer
                    minimum: 0
        "404":
          description: Product or main image not found.
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete the main image and generated thumbnail
      tags:
        - Business Products
  /api/business/products/{productId}/additional-images:
    post:
      operationId: BusinessProduct_addAdditionalImage
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: One JPEG, PNG, WebP, or AVIF image, up to 20 MB.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - productId
                  - image
                properties:
                  ok:
                    type: boolean
                    example: true
                  productId:
                    type: string
                  image:
                    type: string
                    enum:
                      - main
                      - additional
                  index:
                    type: integer
                    minimum: 0
                    description: Zero-based additional image index.
                  deletedAssets:
                    type: integer
                    minimum: 0
        "404":
          description: Product not found.
      security:
        - businessSession: []
          csrfToken: []
      summary: Append one additional image (maximum 20)
      tags:
        - Business Products
  /api/business/products/{productId}/additional-images/{index}:
    put:
      operationId: BusinessProduct_replaceAdditionalImage
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
        - name: index
          required: true
          in: path
          schema:
            pattern: ^(0|[1-9][0-9]*)$
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: One JPEG, PNG, WebP, or AVIF image, up to 20 MB.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - productId
                  - image
                properties:
                  ok:
                    type: boolean
                    example: true
                  productId:
                    type: string
                  image:
                    type: string
                    enum:
                      - main
                      - additional
                  index:
                    type: integer
                    minimum: 0
                    description: Zero-based additional image index.
                  deletedAssets:
                    type: integer
                    minimum: 0
        "404":
          description: Product or image index not found.
      security:
        - businessSession: []
          csrfToken: []
      summary: Replace one additional image by its zero-based index
      tags:
        - Business Products
    delete:
      operationId: BusinessProduct_deleteAdditionalImage
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
        - name: index
          required: true
          in: path
          schema:
            pattern: ^(0|[1-9][0-9]*)$
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - productId
                  - image
                  - deletedAssets
                properties:
                  ok:
                    type: boolean
                    example: true
                  productId:
                    type: string
                  image:
                    type: string
                    enum:
                      - main
                      - additional
                  index:
                    type: integer
                    minimum: 0
                    description: Zero-based additional image index.
                  deletedAssets:
                    type: integer
                    minimum: 0
        "404":
          description: Product or image index not found.
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete one additional image by its zero-based index
      tags:
        - Business Products
  /api/business/products/out-of-stock/{productId}:
    delete:
      description: Deletes the product only when it is out of stock and clears its
        complete product and thumbnail storage prefixes, including empty
        folders. Its company and category are also deleted when no other
        products reference them; deleting the last company product clears the
        company storage prefixes.
      operationId: BusinessProduct_deleteOutOfStockProduct
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: The product was deleted. Nullable relationship IDs identify any
            company or category that was also deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - deletedProductId
                  - deletedAssets
                  - deletedCompanyId
                  - deletedCategoryId
                  - updatedCategories
                properties:
                  ok:
                    type: boolean
                    example: true
                  deletedProductId:
                    type: string
                  deletedAssets:
                    type: integer
                    minimum: 0
                    description: Number of stored objects removed from the product prefixes,
                      including orphaned objects and folder markers.
                  deletedCompanyId:
                    type: string
                    nullable: true
                  deletedCategoryId:
                    type: string
                    nullable: true
                  updatedCategories:
                    type: integer
                    minimum: 0
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete an out-of-stock product and unused relationships
      tags:
        - Business Products
  /api/business/quotation-requests:
    get:
      operationId: BusinessQuotation_getQuotations
      parameters: []
      responses:
        "200":
          description: Up to 200 latest quotation requests.
      security:
        - businessSession: []
      summary: List quotation requests newest first
      tags:
        - Business Quotations
  /api/business/quotation-requests/{quotationId}:
    get:
      operationId: BusinessQuotation_getQuotation
      parameters:
        - name: quotationId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Quotation request not found.
      security:
        - businessSession: []
      summary: Get one quotation request
      tags:
        - Business Quotations
  /api/business/quotation-requests/{quotationId}/status:
    patch:
      operationId: BusinessQuotation_updateStatus
      parameters:
        - name: quotationId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuotationStatusDto"
      responses:
        "200":
          description: Quotation status updated.
        "404":
          description: Quotation request not found.
      security:
        - businessSession: []
          csrfToken: []
      summary: Update quotation workflow status
      tags:
        - Business Quotations
  /api/business/users:
    get:
      operationId: BusinessUser_getUsers
      parameters: []
      responses:
        "200":
          description: Up to 500 catalog users, newest login first.
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required:
                        - customer_id
                        - email
                        - mobile
                        - name
                        - profile_complete
                        - created_at
                        - last_login_at
                      properties:
                        customer_id:
                          type: string
                        email:
                          type: string
                          nullable: true
                        mobile:
                          type: string
                          nullable: true
                        name:
                          type: string
                        profile_complete:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        last_login_at:
                          type: string
                          format: date-time
      security:
        - businessSession: []
      summary: List catalog users by latest login
      tags:
        - Business Users
  /api/catalog/all:
    get:
      operationId: Catalog_getCatalogAll
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      summary: Get public catalog navigation
      tags:
        - Catalog
  /api/catalog/library:
    post:
      operationId: Catalog_getCatalogLibrary
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogLibraryDto"
      responses:
        "201":
          description: ""
