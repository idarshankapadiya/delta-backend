        - Business Messages
  /api/business/messages/{message_id}:
    delete:
      operationId: BusinessMessage_deleteMessage
      parameters:
        - name: message_id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete a contact message
      tags:
        - Business Messages
  /api/business/companies:
    post:
      operationId: BusinessProduct_createCompany
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
