      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogAccessDto"
      responses:
        "201":
          description: ""
      summary: Record a catalog access inquiry
      tags:
        - Catalog
  /api/catalog/access/google:
    post:
      operationId: Catalog_createGoogleAccess
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogGoogleAccessDto"
      responses:
        "201":
          description: ""
      summary: Create catalog access with Google
      tags:
        - Catalog
  /api/catalog/access/firebase/email-link:
    post:
      operationId: Catalog_createFirebaseEmailAccess
