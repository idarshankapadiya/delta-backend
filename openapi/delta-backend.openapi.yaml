  /api/catalog/documents/access:
    post:
      operationId: Catalog_createDocumentAccess
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAccessDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
