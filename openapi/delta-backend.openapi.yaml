openapi: 3.0.0
paths:
  /api/business/auth/google:
    post:
      operationId: BusinessAuth_authenticateWithGoogle
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessGoogleAuthDto"
      responses:
        "201":
          description: ""
      summary: Create a business session with Google
      tags:
        - Business Authentication
  /api/business/auth/me:
    get:
      operationId: BusinessAuth_getCurrentUser
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
      summary: Get the current business session
      tags:
        - Business Authentication
  /api/business/auth/logout:
    post:
      operationId: BusinessAuth_logout
      parameters: []
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Log out of the business session
      tags:
        - Business Authentication
  /api/business/catalog/all:
    get:
      operationId: BusinessCatalog_getCatalogAll
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
      summary: Get catalog data for business administration
      tags:
        - Business Catalog
  /api/business/catalog/documents:
    post:
      operationId: BusinessCatalog_createDocument
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - company_name
                - document_name
                - file
              properties:
                company_name:
                  type: string
                category_name:
                  type: string
                document_name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
          csrfToken: []
      summary: Upload a catalog PDF document
      tags:
        - Business Catalog
  /api/business/catalog/documents/access:
    post:
      operationId: BusinessCatalog_createDocumentAccess
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAccessDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
          csrfToken: []
      summary: Create an administrative signed document URL
      tags:
        - Business Catalog
  /api/business/catalog/documents/{document_id}:
    put:
      operationId: BusinessCatalog_updateDocument
      parameters:
        - name: document_id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document_name:
                  type: string
                category_name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
          csrfToken: []
      summary: Update or replace a catalog PDF document
      tags:
        - Business Catalog
    delete:
      operationId: BusinessCatalog_deleteDocument
      parameters:
        - name: document_id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete a catalog document
      tags:
        - Business Catalog
  /api/business/catalog/companies/{company_slug}:
    put:
      operationId: BusinessCatalog_updateCompany
      parameters:
        - name: company_slug
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogCompanyDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
          csrfToken: []
      summary: Rename or merge a catalog company
      tags:
        - Business Catalog
  /api/business/messages:
    get:
      operationId: BusinessMessage_getMessages
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
      summary: List contact messages
      tags:
        - Business Messages
  /api/business/messages/{message_id}:
    delete:
      operationId: BusinessMessage_deleteMessage
      parameters:
        - name: message_id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete a contact message
      tags:
        - Business Messages
  /api/business/orders:
    get:
      operationId: BusinessOrder_getOrders
      parameters: []
      responses:
        "200":
          description: Up to 200 latest placed customer orders.
      security:
        - businessSession: []
      summary: List placed customer orders newest first
      tags:
        - Business Orders
  /api/business/orders/{orderId}/confirm:
    post:
      description: Idempotently reserves every line item. Insufficient availability
        moves the order to pending_stock and returns 409.
      operationId: BusinessOrder_confirm
      parameters:
        - name: orderId
          required: true
          in: path
          schema:
            maxLength: 160
            type: string
      responses:
        "200":
          description: Order confirmed and stock reserved.
        "404":
          description: Order or product not found.
        "409":
          description: Insufficient stock or invalid order state.
      security:
        - businessSession: []
        - csrfToken: []
      summary: Confirm an order and reserve available stock
      tags:
        - Business Orders
  /api/business/orders/{orderId}/dispatch:
    post:
      operationId: BusinessOrder_dispatch
      parameters:
        - name: orderId
          required: true
          in: path
          schema:
            maxLength: 160
            type: string
      responses:
        "200":
          description: Order dispatched and on-hand stock reduced.
        "409":
          description: Order is not confirmed.
      security:
        - businessSession: []
        - csrfToken: []
      summary: Dispatch an order and consume its reserved stock
      tags:
        - Business Orders
  /api/business/orders/{orderId}/cancel:
    post:
      operationId: BusinessOrder_cancel
      parameters:
        - name: orderId
          required: true
          in: path
          schema:
            maxLength: 160
            type: string
      responses:
        "200":
          description: Order cancelled and reserved stock released.
        "409":
          description: Dispatched or returned order cannot be cancelled.
      security:
        - businessSession: []
        - csrfToken: []
      summary: Cancel an order and release any reservation
      tags:
        - Business Orders
  /api/business/orders/{orderId}/return:
    post:
      description: Use only after returned goods have passed inspection.
      operationId: BusinessOrder_returnOrder
      parameters:
        - name: orderId
          required: true
          in: path
          schema:
            maxLength: 160
            type: string
      responses:
        "200":
          description: Order returned and on-hand stock restored.
        "409":
          description: Order has not been dispatched.
      security:
        - businessSession: []
        - csrfToken: []
      summary: Return all order items to sellable stock
      tags:
        - Business Orders
  /api/business/inventory:
    get:
      description: Returns on-hand, reserved, available, incoming, damaged and reorder
        quantities. Legacy product stock is used until its first ledger
        mutation.
      operationId: BusinessInventory_getInventory
      parameters: []
      responses:
        "200":
          description: Inventory sorted by product name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryListResponseDto"
      security:
        - businessSession: []
      summary: List inventory for active products
      tags:
        - Business Inventory
  /api/business/inventory/low-stock:
    get:
      operationId: BusinessInventory_getLowStock
      parameters: []
      responses:
        "200":
          description: Products at or below their reorder level.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryListResponseDto"
      security:
        - businessSession: []
      summary: List low-stock and out-of-stock products
      tags:
        - Business Inventory
  /api/business/inventory/movements:
    get:
      operationId: BusinessInventory_getMovements
      parameters:
        - name: productId
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 500
            default: 100
            type: number
      responses:
        "200":
          description: Newest stock movements first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMovementListResponseDto"
      security:
        - businessSession: []
      summary: List immutable stock movement history
      tags:
        - Business Inventory
  /api/business/inventory/{productId}:
    get:
      operationId: BusinessInventory_getProductInventory
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponseDto"
        "404":
          description: Product not found.
      security:
        - businessSession: []
      summary: Get inventory for one product
      tags:
        - Business Inventory
  /api/business/inventory/receipts:
    post:
      description: Atomically increases on-hand stock, updates public availability,
        and appends a purchase receipt movement.
      operationId: BusinessInventory_receive
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveStockDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponseDto"
        "409":
          description: The resulting stock state is invalid.
      security:
        - businessSession: []
        - csrfToken: []
      summary: Receive purchased stock
      tags:
        - Business Inventory
  /api/business/inventory/{productId}/adjustments:
    post:
      description: Applies a signed manual or damage adjustment and records the
        before/after quantities in the immutable ledger.
      operationId: BusinessInventory_adjust
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustStockDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponseDto"
        "409":
          description: Adjustment would make stock negative.
      security:
        - businessSession: []
        - csrfToken: []
      summary: Adjust stock with a mandatory reason
      tags:
        - Business Inventory
  /api/business/inventory/{productId}/stock-counts:
    post:
      operationId: BusinessInventory_count
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockCountDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponseDto"
        "409":
          description: Count is below already reserved stock.
      security:
        - businessSession: []
        - csrfToken: []
      summary: Reconcile stock to a physical count
      tags:
        - Business Inventory
  /api/business/inventory/{productId}/settings:
    put:
      operationId: BusinessInventory_updateSettings
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventorySettingsDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponseDto"
      security:
        - businessSession: []
        - csrfToken: []
      summary: Set the product reorder level
      tags:
        - Business Inventory
  /api/business/companies:
    post:
      operationId: BusinessProduct_createCompany
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductCompanyDto"
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Create a product company
      tags:
        - Business Products
  /api/business/companies/{companyId}:
    put:
      operationId: BusinessProduct_updateCompany
      parameters:
        - name: companyId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductCompanyDto"
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Update a product company
      tags:
        - Business Products
    delete:
      description: Deletes a company only when no products reference it, removes the
        company from linked categories, and clears its product and thumbnail
        storage prefixes, including empty folders.
      operationId: BusinessProduct_deleteCompany
      parameters:
        - name: companyId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: The unused company, its owned storage prefixes, and its category
            links were deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - deletedCompanyId
                  - deletedAssets
                  - updatedCategories
                properties:
                  ok:
                    type: boolean
                    example: true
                  deletedCompanyId:
                    type: string
                  deletedAssets:
                    type: integer
                    minimum: 0
                  updatedCategories:
                    type: integer
                    minimum: 0
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete an unused product company
      tags:
        - Business Products
  /api/business/categories:
    post:
      operationId: BusinessProduct_createCategory
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductCategoryDto"
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Create a product category
      tags:
        - Business Products
  /api/business/categories/{categoryId}:
    put:
      operationId: BusinessProduct_updateCategory
      parameters:
        - name: categoryId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductCategoryDto"
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Update a product category
      tags:
        - Business Products
    delete:
      operationId: BusinessProduct_deleteCategory
      parameters:
        - name: categoryId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete an unused product category
      tags:
        - Business Products
  /api/business/products:
    post:
      operationId: BusinessProduct_createProduct
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductDto"
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Create a product and optionally its company or category
      tags:
        - Business Products
  /api/business/products/upload:
    post:
      operationId: BusinessProduct_createProductUpload
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - product
                - main_image
              properties:
                product:
                  type: string
                  description: JSON-encoded CreateProductDto payload.
                main_image:
                  type: string
                  format: binary
                  description: Required JPEG, PNG, WebP, or AVIF main image. A WebP thumbnail is
                    generated automatically.
                additional_images:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
                  description: Optional replacement additional product images.
                brochure:
                  type: string
                  format: binary
                  description: Optional PDF brochure.
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Create a product and upload its assets
      tags:
        - Business Products
  /api/business/products/{productId}:
    put:
      operationId: BusinessProduct_updateProduct
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductDto"
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Update a product
      tags:
        - Business Products
    delete:
      description: Permanently deletes the selected product regardless of its stock
        status and clears its complete product and thumbnail storage prefixes,
        including empty folders. Its company and category are also deleted when
        no other products reference them; deleting the last company product
        clears the company storage prefixes. This action cannot be undone.
      operationId: BusinessProduct_deleteProduct
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: The product and its complete owned storage prefixes were
            permanently deleted. Nullable relationship IDs identify any company
            or category that was also deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - deletedProductId
                  - deletedAssets
                  - deletedCompanyId
                  - deletedCategoryId
                  - updatedCategories
                properties:
                  ok:
                    type: boolean
                    example: true
                  deletedProductId:
                    type: string
                  deletedAssets:
                    type: integer
                    minimum: 0
                    description: Number of stored objects removed from the product prefixes,
                      including orphaned objects and folder markers.
                  deletedCompanyId:
                    type: string
                    nullable: true
                  deletedCategoryId:
                    type: string
                    nullable: true
                  updatedCategories:
                    type: integer
                    minimum: 0
      security:
        - businessSession: []
          csrfToken: []
      summary: Permanently delete a product
      tags:
        - Business Products
  /api/business/products/{productId}/specifications/{key}:
    put:
      description: Updates an existing specification value and optionally renames its
        key. Returns 404 when the product or specification does not exist and
        409 when the new key already exists.
      operationId: BusinessProduct_updateProductSpecification
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
        - name: key
          required: true
          in: path
          schema:
            maxLength: 160
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 160
                value:
                  description: String, number, boolean, or null.
                  oneOf:
                    - type: string
                    - type: number
                    - type: boolean
                    - type: string
                      nullable: true
                      enum:
                        - null
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - productId
                  - key
                  - value
                properties:
                  ok:
                    type: boolean
                    example: true
                  productId:
                    type: string
                  key:
                    type: string
                  value:
                    description: Updated specification value (string, number, boolean, or null).
        "404":
          description: Product or specification not found.
        "409":
          description: Replacement key already exists.
      security:
        - businessSession: []
          csrfToken: []
      summary: Edit one product specification
      tags:
        - Business Products
    delete:
      description: Removes an existing specification. Returns 404 when the product or
        specification does not exist.
      operationId: BusinessProduct_deleteProductSpecification
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
        - name: key
          required: true
          in: path
          schema:
            maxLength: 160
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - productId
                  - deletedKey
                properties:
                  ok:
                    type: boolean
                    example: true
                  productId:
                    type: string
                  deletedKey:
                    type: string
        "404":
          description: Product or specification not found.
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete one product specification
      tags:
        - Business Products
  /api/business/products/{productId}/upload:
    put:
      operationId: BusinessProduct_updateProductUpload
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - product
              properties:
                product:
                  type: string
                  description: JSON-encoded UpdateProductDto payload.
                main_image:
                  type: string
                  format: binary
                  description: Optional replacement main image. A replacement WebP thumbnail is
                    generated automatically.
                additional_images:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
                  description: Optional replacement additional product images.
                brochure:
                  type: string
                  format: binary
                  description: Optional PDF brochure.
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Update a product and upload replacement assets
      tags:
        - Business Products
  /api/business/products/{productId}/main-image:
    put:
      operationId: BusinessProduct_replaceMainImage
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: One JPEG, PNG, WebP, or AVIF image, up to 20 MB.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - productId
                  - image
                properties:
                  ok:
                    type: boolean
                    example: true
                  productId:
                    type: string
                  image:
                    type: string
                    enum:
                      - main
                      - additional
                  index:
                    type: integer
                    minimum: 0
                    description: Zero-based additional image index.
                  deletedAssets:
                    type: integer
                    minimum: 0
        "404":
          description: Product not found.
      security:
        - businessSession: []
          csrfToken: []
      summary: Replace the main image and regenerate its WebP thumbnail
      tags:
        - Business Products
    delete:
      description: Removes the main image and thumbnail objects and clears current and
        legacy image references from the product.
      operationId: BusinessProduct_deleteMainImage
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - productId
                  - image
                  - deletedAssets
                properties:
                  ok:
                    type: boolean
                    example: true
                  productId:
                    type: string
                  image:
                    type: string
                    enum:
                      - main
                      - additional
                  index:
                    type: integer
                    minimum: 0
                    description: Zero-based additional image index.
                  deletedAssets:
                    type: integer
                    minimum: 0
        "404":
          description: Product or main image not found.
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete the main image and generated thumbnail
      tags:
        - Business Products
  /api/business/products/{productId}/additional-images:
    post:
      operationId: BusinessProduct_addAdditionalImage
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: One JPEG, PNG, WebP, or AVIF image, up to 20 MB.
