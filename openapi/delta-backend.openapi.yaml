openapi: 3.0.0
paths:
  /api/business/auth/google:
    post:
      operationId: BusinessAuth_authenticateWithGoogle
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessGoogleAuthDto"
      responses:
        "201":
          description: ""
      summary: Create a business session with Google
      tags:
        - Business Authentication
  /api/business/auth/me:
    get:
      operationId: BusinessAuth_getCurrentUser
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
      summary: Get the current business session
      tags:
        - Business Authentication
  /api/business/auth/logout:
    post:
      operationId: BusinessAuth_logout
      parameters: []
      responses:
        "201":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Log out of the business session
      tags:
        - Business Authentication
  /api/business/catalog/all:
    get:
      operationId: BusinessCatalog_getCatalogAll
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
      summary: Get catalog data for business administration
      tags:
        - Business Catalog
  /api/business/catalog/documents:
    post:
      operationId: BusinessCatalog_createDocument
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - company_name
                - document_name
                - file
              properties:
                company_name:
                  type: string
                category_name:
                  type: string
                document_name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
          csrfToken: []
      summary: Upload a catalog PDF document
      tags:
        - Business Catalog
  /api/business/catalog/documents/access:
    post:
      operationId: BusinessCatalog_createDocumentAccess
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAccessDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
          csrfToken: []
      summary: Create an administrative signed document URL
      tags:
        - Business Catalog
  /api/business/catalog/documents/{document_id}:
    put:
      operationId: BusinessCatalog_updateDocument
      parameters:
        - name: document_id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document_name:
                  type: string
                category_name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security:
        - businessSession: []
          csrfToken: []
      summary: Update or replace a catalog PDF document
      tags:
        - Business Catalog
    delete:
      operationId: BusinessCatalog_deleteDocument
      parameters:
        - name: document_id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security:
        - businessSession: []
          csrfToken: []
      summary: Delete a catalog document
      tags:
        - Business Catalog
  /api/business/catalog/companies/{company_slug}:
    put:
      operationId: BusinessCatalog_updateCompany
      parameters:
        - name: company_slug
          required: true
          in: path
          schema:
